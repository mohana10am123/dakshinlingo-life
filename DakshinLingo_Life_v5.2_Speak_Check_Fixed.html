<!DOCTYPE html>
<html lang="te">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#4656c8">
<meta name="description" content="Learn Telugu, Tamil, Kannada and Malayalam with lessons, speaking practice, tracing and quizzes.">
<title>DakshinLingo Life v5.2 - Production Polish</title>
<style>
  :root {
    --c-topics: #4f46e5;
    --c-tutor: #059669;
    --c-script: #d97706;
    --c-quiz: #e11d48;
    --theme: #4f46e5;
    --bg: #f8fafc;
    --card: #ffffff;
    --text: #0f172a;
    --muted: #64748b;
    --border: #e2e8f0;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding-bottom: 82px;
    line-height: 1.4;
  }
  header {
    background: var(--theme);
    color: #fff;
    padding: 12px 14px;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 4px 14px rgba(0,0,0,0.14);
    transition: background 0.3s ease;
  }
  .top-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .brand { font-size: 1.15rem; font-weight: 800; }
  .brand span { color: #fef08a; }
  .stats { display: flex; gap: 6px; }
  .pill { background: rgba(255,255,255,0.22); padding: 4px 9px; border-radius: 20px; font-size: 0.76rem; font-weight: 800; }

  .dash-bar { background: rgba(0,0,0,0.18); border-radius: 12px; padding: 7px 10px; margin-bottom: 10px; }
  .dash-meta { display: flex; justify-content: space-between; font-size: 0.72rem; font-weight: 700; margin-bottom: 4px; opacity: 0.95; }
  .prog-track { background: rgba(255,255,255,0.25); height: 7px; border-radius: 6px; overflow: hidden; }
  .prog-fill { background: #fef08a; height: 100%; width: 0%; transition: width 0.35s ease; border-radius: 6px; }

  .lang-picker {
    display: grid; grid-template-columns: 1fr auto 1fr; gap: 8px; align-items: center;
    background: rgba(255,255,255,0.16); padding: 7px; border-radius: 14px;
  }
  .lp-col label { display: block; font-size: 0.64rem; text-transform: uppercase; opacity: 0.9; margin-bottom: 2px; font-weight: 700; }
  .lp-sel {
    width: 100%; padding: 6px 8px; border-radius: 8px; border: none;
    font-weight: 700; font-size: 0.82rem; color: #1e293b; background: #fff;
  }
  .swap-btn {
    background: #fff; color: var(--theme); border: none; width: 30px; height: 30px;
    border-radius: 50%; font-size: 0.95rem; font-weight: 800; cursor: pointer; margin-top: 12px;
  }

  main { padding: 14px; max-width: 600px; margin: 0 auto; }
  .view { display: none; animation: fadeUp 0.22s ease; }
  .view.active { display: block; }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

  .topic-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 14px; }
  .topic-card {
    border-radius: 16px; padding: 13px 12px; color: #fff; cursor: pointer;
    box-shadow: 0 4px 10px rgba(0,0,0,0.08); transition: transform 0.15s;
  }
  .topic-card:active { transform: scale(0.96); }
  .topic-card.selected { outline: 3px solid #0f172a; outline-offset: 2px; }
  .t-icon { font-size: 1.5rem; margin-bottom: 3px; display: block; }
  .t-name { font-size: 0.94rem; font-weight: 800; }
  .t-sub { font-size: 0.72rem; opacity: 0.9; }

  .card {
    background: var(--card); border-radius: 16px; padding: 14px; margin-bottom: 12px;
    border: 1px solid var(--border); box-shadow: 0 2px 6px rgba(15,23,42,0.04);
  }
  .card.done { border-left: 5px solid #10b981; background: #f0fdf4; }
  .known-line { font-size: 0.92rem; color: var(--muted); font-weight: 700; margin-bottom: 4px; }
  .target-line { font-size: 1.24rem; font-weight: 800; color: var(--text); margin-bottom: 3px; }
  .pron-line { font-size: 0.88rem; color: var(--theme); font-weight: 700; }
  .tip-box {
    background: #f8fafc; border-left: 3px solid var(--theme); padding: 6px 10px;
    font-size: 0.78rem; color: #475569; margin-top: 8px; border-radius: 0 8px 8px 0;
  }
  .btn-row { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; align-items: center; }
  .btn {
    border: none; border-radius: 10px; padding: 8px 11px; font-size: 0.8rem;
    font-weight: 700; cursor: pointer; display: inline-flex; align-items: center; gap: 4px;
  }
  .btn-pri { background: var(--theme); color: #fff; }
  .btn-soft { background: #e2e8f0; color: #1e293b; }
  .btn-mic { background: #ffe4e6; color: #e11d48; }
  .btn-mic.listening { background: #e11d48; color: #fff; animation: pulse 1s infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.55; } }
  .btn-done { background: #f1f5f9; color: var(--text); margin-left: auto; }
  .btn-done.active { background: #10b981; color: #fff; }
  .mic-res { font-size: 0.8rem; margin-top: 8px; font-weight: 700; min-height: 18px; }

  .mode-tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
  .mode-btn {
    padding: 9px; border-radius: 12px; border: 1.5px solid #a7f3d0; background: #fff;
    color: #065f46; font-weight: 800; font-size: 0.84rem; cursor: pointer;
  }
  .mode-btn.active { background: #059669; color: #fff; border-color: #059669; }
  .q-mode-btn {
    padding: 9px; border-radius: 12px; border: 1.5px solid #fecdd3; background: #fff;
    color: #9f1239; font-weight: 800; font-size: 0.84rem; cursor: pointer;
  }
  .q-mode-btn.active { background: #e11d48; color: #fff; border-color: #e11d48; }

  .chip-bar { display: flex; gap: 8px; overflow-x: auto; margin-bottom: 12px; padding-bottom: 4px; scrollbar-width: none; }
  .chip {
    background: #fff; border: 1.5px solid var(--border); padding: 6px 12px; border-radius: 20px;
    font-size: 0.8rem; font-weight: 700; color: var(--muted); white-space: nowrap; cursor: pointer;
  }
  .chip.active { background: var(--theme); color: #fff; border-color: var(--theme); }

  .tutor-card {
    background: #fff; border-radius: 18px; padding: 16px; border: 1.5px solid #a7f3d0;
    box-shadow: 0 6px 16px rgba(5,150,105,0.08);
  }
  .ai-badge {
    display: inline-block; background: #d1fae5; color: #065f46; font-size: 0.72rem;
    font-weight: 800; padding: 4px 10px; border-radius: 20px; margin-bottom: 10px;
  }
  .ai-explain { font-size: 0.88rem; color: #334155; margin-bottom: 12px; background: #f0fdf4; padding: 10px; border-radius: 12px; }
  .ai-big { font-size: 1.32rem; font-weight: 800; color: #0f172a; margin-bottom: 4px; }
  .ai-big.alpha-big { font-size: 3.2rem; color: #be123c; margin: 8px 0; }
  .ai-pron { font-size: 0.92rem; color: #059669; font-weight: 700; margin-bottom: 12px; }
  .ai-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px; }

  .rp-step-bar { display: flex; gap: 5px; margin-bottom: 10px; }
  .rp-dot { flex: 1; height: 6px; border-radius: 4px; background: #e2e8f0; }
  .rp-dot.done { background: #10b981; }
  .rp-dot.now { background: #059669; }
  .chat-box {
    background: #f8fafc; border-radius: 14px; border: 1px solid var(--border); padding: 12px;
    min-height: 200px; max-height: 280px; overflow-y: auto; display: flex; flex-direction: column; gap: 9px; margin-bottom: 10px;
  }
  .msg { max-width: 88%; padding: 9px 12px; border-radius: 13px; font-size: 0.88rem; }
  .msg.bot { background: #ecfdf5; border: 1px solid #a7f3d0; color: #0f172a; align-self: flex-start; border-bottom-left-radius: 3px; }
  .msg.user { background: #059669; color: #fff; align-self: flex-end; border-bottom-right-radius: 3px; }
  .msg-sub { font-size: 0.75rem; opacity: 0.85; display: block; margin-top: 2px; }
  .rp-opts { display: flex; flex-direction: column; gap: 8px; }
  .rp-opt-btn {
    background: #fff; border: 1.5px solid #059669; color: #065f46; padding: 10px 12px;
    border-radius: 12px; text-align: left; font-weight: 700; font-size: 0.86rem; cursor: pointer;
  }
  .rp-opt-btn small { display: block; font-weight: 500; color: var(--muted); margin-top: 2px; }

  .trick-panel {
    background: #fffbeb; border: 1.5px solid #fcd34d; border-radius: 16px;
    padding: 13px; margin-bottom: 12px; box-shadow: 0 3px 10px rgba(217,119,6,0.08);
  }
  .tp-top { display: flex; align-items: center; gap: 12px; margin-bottom: 6px; }
  .tp-big { font-size: 2.2rem; font-weight: 800; color: #b45309; background: #fef3c7; padding: 4px 14px; border-radius: 12px; }
  .tp-info { font-size: 0.88rem; font-weight: 700; color: #0f172a; }
  .tp-trick { font-size: 0.82rem; color: #78350f; background: #fff; padding: 8px 10px; border-radius: 10px; border-left: 3px solid #d97706; }

  /* Interactive Drawing / Tracing Pad */
  .pad-box {
    background: #fff; border: 2px solid #fcd34d; border-radius: 16px;
    padding: 12px; margin-bottom: 12px; text-align: center;
  }
  .pad-title { font-size: 0.82rem; font-weight: 800; color: #92400e; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
  .canvas-wrap {
    position: relative; width: 100%; height: 190px; background: #fffef7;
    border: 2px dashed #f59e0b; border-radius: 14px; overflow: hidden; touch-action: none;
  }
  .ghost-letter {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    font-size: 7.5rem; font-weight: 800; color: rgba(217,119,6,0.16);
    pointer-events: none; user-select: none;
  }
  #traceCanvas { position: relative; z-index: 2; width: 100%; height: 100%; cursor: crosshair; }
  .pad-controls { display: flex; gap: 8px; margin-top: 10px; justify-content: center; align-items: center; flex-wrap: wrap; }
  .color-dot { width: 24px; height: 24px; border-radius: 50%; border: 2px solid #fff; box-shadow: 0 0 0 1.5px #cbd5e1; cursor: pointer; }
  .color-dot.active { box-shadow: 0 0 0 2.5px #0f172a; transform: scale(1.1); }

  .script-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .alpha-card {
    background: #fff; border: 1.5px solid #fde68a; border-radius: 13px;
    padding: 10px 4px; text-align: center; cursor: pointer;
  }
  .alpha-card:active, .alpha-card.picked { background: #fef3c7; border-color: #d97706; transform: scale(0.96); }
  .a-target { font-size: 1.55rem; font-weight: 800; color: #b45309; }
  .a-known { font-size: 0.92rem; font-weight: 700; color: #0f172a; }
  .a-sound { font-size: 0.7rem; color: var(--muted); font-weight: 700; }

  .cmp-table { width: 100%; border-collapse: collapse; background: #fff; border-radius: 14px; overflow: hidden; border: 1px solid #fde68a; }
  .cmp-table th { background: #fef3c7; color: #92400e; font-size: 0.76rem; padding: 8px 4px; }
  .cmp-table td { text-align: center; padding: 8px 4px; border-top: 1px solid #fef3c7; font-size: 1.15rem; font-weight: 800; }
  .cmp-table td.snd { font-size: 0.75rem; color: var(--muted); }

  .quiz-card { background: #fff; border-radius: 18px; padding: 18px; border: 1.5px solid #fecdd3; text-align: center; }
  .opt-grid { display: grid; gap: 9px; margin-top: 12px; }
  .opt-grid.alpha-grid { grid-template-columns: 1fr 1fr; }
  .opt-btn {
    background: #f8fafc; border: 1.5px solid var(--border); padding: 12px;
    border-radius: 12px; font-size: 0.92rem; font-weight: 700; cursor: pointer; text-align: left;
  }
  .opt-grid.alpha-grid .opt-btn { text-align: center; font-size: 1.25rem; padding: 14px 8px; }
  .opt-btn.correct { background: #dcfce7; border-color: #10b981; color: #166534; }
  .opt-btn.wrong { background: #fee2e2; border-color: #ef4444; color: #991b1b; }
  .quiz-trick {
    margin-top: 10px; font-size: 0.8rem; color: #78350f; background: #fffbeb;
    padding: 8px 10px; border-radius: 10px; border-left: 3px solid #d97706; text-align: left; display: none;
  }

  #toast {
    position: fixed; top: 68px; left: 50%; transform: translateX(-50%);
    background: #0f172a; color: #fef08a; padding: 8px 16px; border-radius: 24px;
    font-size: 0.84rem; font-weight: 800; z-index: 200; opacity: 0; pointer-events: none; transition: opacity 0.25s;
  }
  #toast.show { opacity: 1; }

  nav {
    position: fixed; bottom: 0; left: 0; right: 0; background: #fff;
    border-top: 1px solid var(--border); display: grid; grid-template-columns: repeat(4, 1fr);
    padding: 8px 6px 10px; z-index: 100; gap: 6px;
  }
  .nav-item {
    border: none; border-radius: 12px; padding: 6px 2px; background: #f8fafc;
    color: var(--muted); font-size: 0.72rem; font-weight: 800;
    display: flex; flex-direction: column; align-items: center; gap: 2px; cursor: pointer;
  }
  .nav-item span { font-size: 1.25rem; }
  .nav-item[data-tab="topics"].active { background: #eef2ff; color: var(--c-topics); }
  .nav-item[data-tab="tutor"].active { background: #ecfdf5; color: var(--c-tutor); }
  .nav-item[data-tab="script"].active { background: #fffbeb; color: var(--c-script); }
  .nav-item[data-tab="quiz"].active { background: #fff1f2; color: var(--c-quiz); }

/* v5.2 clean UI layer */
:root{
  --bg:#f5f7fb;--card:#fff;--text:#172033;--muted:#667085;--border:#e7ebf2;
  --theme:#4656c8;--c-topics:#4656c8;--c-tutor:#13856d;--c-script:#bd821b;--c-quiz:#cf4964;
}
body{background:var(--bg);color:var(--text);line-height:1.5;padding-bottom:calc(88px + env(safe-area-inset-bottom))}
header{padding:14px 16px 16px;box-shadow:0 2px 12px rgba(16,24,40,.08)}
.top-row{margin-bottom:12px}.brand{font-size:1.08rem;letter-spacing:-.025em}
.brand span{color:#e8eaff}.stats{gap:7px}.pill{background:rgba(255,255,255,.16);padding:5px 10px;font-size:.72rem}
.dash-bar{padding:9px 11px;margin-bottom:11px;background:rgba(0,0,0,.13)}
.lang-picker{background:rgba(255,255,255,.13);padding:8px;border:1px solid rgba(255,255,255,.12)}
.lp-sel{padding:9px 8px;border-radius:9px;font-size:.78rem;outline:none}
.swap-btn{width:34px;height:34px;box-shadow:0 1px 4px rgba(0,0,0,.1)}
main{padding:16px 14px;max-width:680px}
.view.active{animation:fadeUp .18s ease}
.topic-grid{gap:10px;margin-bottom:16px}
.topic-card{border-radius:14px;padding:13px;box-shadow:none;min-height:94px}
.topic-card.selected{outline:2px solid var(--text);outline-offset:2px}
.t-icon{font-size:1.35rem}.t-name{font-size:.9rem}.t-sub{font-size:.7rem}
.card,.tutor-card,.quiz-card,.pad-box,.trick-panel{border-radius:14px;box-shadow:0 1px 4px rgba(16,24,40,.045);margin-bottom:12px}
.card{padding:15px;border:1px solid var(--border)}
.card.done{border-left:3px solid #16a37a;background:#f5fbf8}
.known-line{font-size:.82rem}.target-line{font-size:1.2rem;line-height:1.45}
.pron-line{font-size:.83rem}.tip-box{background:#f7f8fc;border-left-width:2px}
.btn{border-radius:9px;padding:9px 11px;font-size:.77rem}
.btn-pri{background:var(--theme)}.btn-soft{background:#f0f2f7;color:#344054}
.btn-mic{background:#fff0f2;color:#c23e58}
.btn-done{margin-left:0}.btn-row{gap:7px}
.mode-tabs{gap:8px}.mode-btn,.q-mode-btn{border-radius:10px;padding:10px;font-size:.8rem}
.chip-bar{gap:7px}.chip{border-radius:9px;padding:7px 11px;font-size:.76rem}
.tutor-card{padding:15px;border:1px solid var(--border);box-shadow:none}
.ai-badge{font-size:.68rem;letter-spacing:.03em}
.ai-explain{border-radius:10px;font-size:.83rem}
.ai-big{font-size:1.25rem}.ai-pron{font-size:.85rem}
.chat-box{border-radius:11px;min-height:180px}
.msg{font-size:.83rem}.rp-opt-btn{border-radius:10px;padding:11px}
.trick-panel{background:#fffaf0;border:1px solid #f1dfb8;box-shadow:none}
.tp-big{font-size:2rem;border-radius:10px}
.pad-box{border:1px solid #eadfca;padding:13px}
.canvas-wrap{border:1.5px dashed #d9b56e;border-radius:11px;background:#fffdf8}
.ghost-letter{font-size:7rem;color:rgba(180,130,45,.14)}
.color-dot{width:22px;height:22px}
.script-grid{grid-template-columns:repeat(4,minmax(0,1fr));gap:7px}
.alpha-card{border:1px solid #eee4d1;border-radius:11px;padding:10px 3px;box-shadow:none}
.alpha-card.picked{background:#fff8e9;border-color:#c38a2e}
.a-target{font-size:1.5rem;color:#9b6a17}.a-known{font-size:.85rem}
.quiz-card{padding:17px;border:1px solid #f0dce1;box-shadow:none}
.opt-btn{border-radius:10px;padding:11px;font-size:.86rem}
nav{padding:8px 8px max(10px,env(safe-area-inset-bottom));box-shadow:0 -3px 16px rgba(16,24,40,.05);border-top:1px solid var(--border);gap:7px}
.nav-item{border-radius:10px;background:transparent;font-size:.69rem;padding:7px 2px}
.nav-item span{font-size:1.15rem}
#toast{top:76px;background:#172033;color:#fff;font-size:.8rem;box-shadow:0 4px 14px rgba(0,0,0,.16)}
button,select{font-family:inherit} button{touch-action:manipulation} .topic-card:focus-visible,.alpha-card:focus-visible,.msg:focus-visible{outline:3px solid rgba(70,86,200,.35);outline-offset:3px}button:focus-visible,select:focus-visible{outline:3px solid rgba(70,86,200,.3);outline-offset:2px}
@media(min-width:560px){main{padding:20px 18px}.topic-grid{gap:12px}.card{padding:17px}}
@media(max-width:370px){.brand{font-size:.98rem}.stats{gap:4px}.pill{font-size:.66rem;padding:4px 7px}.lp-sel{font-size:.72rem}.btn{padding:8px 9px}.script-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}


  .card .mic-res[aria-live], #quizMsg[aria-live]{font-weight:700}
  .canvas-wrap{user-select:none;-webkit-user-select:none}
  @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important;transition-duration:.01ms!important}}
</style>
</head>
<body>

<div id="toast">+10 XP! 🎉</div>

<header>
  <div class="top-row">
    <div class="brand">Dakshin<span>Lingo Life</span></div>
    <div class="stats">
      <div class="pill">🔥 <span id="streakVal">1</span> Day</div>
      <div class="pill">⚡ <span id="xpVal">0</span> XP</div>
    </div>
  </div>
  <div class="dash-bar">
    <div class="dash-meta">
      <span>🎯 Daily Goal: <span id="dailyXpTxt">0</span> / 50 XP</span>
      <span id="coursePctTxt">Course: 0%</span>
    </div>
    <div class="prog-track"><div class="prog-fill" id="dailyProgFill"></div></div>
  </div>
  <div class="lang-picker">
    <div class="lp-col">
      <label>Naa Bhasha (Known)</label>
      <select id="knownSel" class="lp-sel" onchange="onLangChange('known')">
        <option value="te" selected>తెలుగు (Telugu)</option>
        <option value="ta">தமிழ் (Tamil)</option>
        <option value="kn">ಕನ್ನಡ (Kannada)</option>
        <option value="ml">മലയാളം (Malayalam)</option>
      </select>
    </div>
    <button class="swap-btn" onclick="swapLangs()">⇄</button>
    <div class="lp-col">
      <label>Nerchukovali (Learn)</label>
      <select id="targetSel" class="lp-sel" onchange="onLangChange('target')">
        <option value="te">తెలుగు (Telugu)</option>
        <option value="ta">தமிழ் (Tamil)</option>
        <option value="kn">ಕನ್ನಡ (Kannada)</option>
        <option value="ml" selected>മലയാളം (Malayalam)</option>
      </select>
    </div>
  </div>
</header>

<main>
  <!-- 1. GOAL TOPICS -->
  <section id="view-topics" class="view active">
    <div class="topic-grid" id="topicGrid"></div>
    <div id="lessonList"></div>
  </section>

  <!-- 2. GUIDED TUTOR + 5-STEP ROLEPLAY -->
  <section id="view-tutor" class="view">
    <div class="mode-tabs">
      <button class="mode-btn active" id="btnModeRp" onclick="setTutorMode('roleplay')">🎭 5-Step Practice</button>
      <button class="mode-btn" id="btnModeGuide" onclick="setTutorMode('guided')">📖 Guided Explain</button>
    </div>
    <div class="chip-bar" id="tutorChips"></div>
    <div class="tutor-card" id="tutorCard"></div>
  </section>

  <!-- 3. FULL AKSHARAMALA + TRACING PAD -->
  <section id="view-script" class="view">
    <div class="chip-bar" id="alphaChips">
      <button class="chip active" onclick="setAlpha('vowels', this)">Achulu (Vowels)</button>
      <button class="chip" onclick="setAlpha('cons', this)">Hallulu (Consonants)</button>
      <button class="chip" onclick="setAlpha('compare', this)">📊 Compare All 4</button>
    </div>

const todayStr = new Date().toDateString();
const STORAGE_KEY = 'dakshin_life_v5'; // Keep v5 progress compatible with existing installs.
function loadState(){
  const fallback = {xp:0,dailyXp:0,streak:1,lastDate:'',done:[],rewards:[]};
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    const saved = raw ? JSON.parse(raw) : {};
    const data = saved && typeof saved === 'object' && !Array.isArray(saved) ? saved : {};
    return {
      ...fallback,
      xp: Number.isFinite(Number(data.xp)) ? Math.max(0, Math.floor(Number(data.xp))) : 0,
      dailyXp: Number.isFinite(Number(data.dailyXp)) ? Math.max(0, Math.floor(Number(data.dailyXp))) : 0,
      streak: Number.isFinite(Number(data.streak)) ? Math.max(1, Math.floor(Number(data.streak))) : 1,
      lastDate: typeof data.lastDate === 'string' ? data.lastDate : '',
      done: Array.isArray(data.done) ? data.done.filter(x => typeof x === 'string') : [],
      rewards: Array.isArray(data.rewards) ? data.rewards.filter(x => typeof x === 'string') : []
    };
  } catch(e) { return fallback; }
}
let state = loadState();

function initStreak() {
  if (state.lastDate !== todayStr) {
    const yest = new Date(Date.now() - 86400000).toDateString();
    state.streak = (state.lastDate === yest) ? state.streak + 1 : 1;
    state.dailyXp = 0;
    state.lastDate = todayStr;
    saveState();
  }
}

function showToast(msg) {

function saveState() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch(e) { /* app remains usable if storage is blocked */ }
  document.getElementById('xpVal').textContent = state.xp;
  document.getElementById('streakVal').textContent = state.streak;
  document.getElementById('dailyXpTxt').textContent = state.dailyXp;
  document.getElementById('dailyProgFill').style.width = Math.min(100, Math.round((state.dailyXp / 50) * 100)) + '%';

  document.getElementById('coursePctTxt').textContent = `Course: ${Math.round((targetDone / DATA.length) * 100)}%`;
}

function addXP(pts, msg) {
  state.xp = Math.max(0, Number(state.xp)||0) + pts;
  state.dailyXp = Math.max(0, Number(state.dailyXp)||0) + pts;
  saveState();
  showToast(msg || `+${pts} XP! 🎉`);
}
function rewardOnce(key, pts, msg) {
  const rewardKey = `${todayStr}|${key}`;
  if (state.rewards.includes(rewardKey)) {
    showToast('ఈరోజు ఈ practice XP ఇప్పటికే పొందారు');
    return false;
  }
  state.rewards.push(rewardKey);
  if (state.rewards.length > 500) state.rewards = state.rewards.slice(-500);
  addXP(pts, msg);
  return true;
}

function speak(text, rate = 1.0, langOverride = null) {
  if (!('speechSynthesis' in window) || !text || text === '—') return;
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text.replace('*', ''));
  u.lang = LANGS[langOverride || targetLang].code;
  u.rate = rate;
  window.speechSynthesis.speak(u);
}

let activeSpeechRecognition = null;

function checkSpeech(expectedText, btnEl, resId) {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  const resEl = document.getElementById(resId);
  if (!resEl || !btnEl) return;

  if (!SR) {
    resEl.textContent = '⚠️ మీ బ్రౌజర్‌లో Speech Recognition అందుబాటులో లేదు. Androidలో తాజా Chrome ఉపయోగించండి.';
    return;
  }

  if (activeSpeechRecognition) {
    try { activeSpeechRecognition.abort(); } catch (e) {}
    activeSpeechRecognition = null;
  }

  const rec = new SR();
  activeSpeechRecognition = rec;
  rec.lang = (LANGS[targetLang] || LANGS.te).code;
  rec.interimResults = false;
  rec.continuous = false;
  rec.maxAlternatives = 3;

  const originalLabel = '🎤 Speak & Check';
  let finished = false;
  const resetButton = () => {
    btnEl.dataset.listening = 'false';
    btnEl.classList.remove('listening');
    btnEl.textContent = originalLabel;
    if (activeSpeechRecognition === rec) activeSpeechRecognition = null;
  };

  btnEl.dataset.listening = 'true';
  btnEl.classList.add('listening');
  btnEl.textContent = '🎙️ వింటున్నాను...';
  resEl.textContent = '🎙️ ఇప్పుడు మైక్‌లో స్పష్టంగా మాట్లాడండి...';

  const normalize = value => String(value || '').toLocaleLowerCase().normalize('NFKC')
    .replace(/[.,!?;:'"“”‘’\-–—।]/g, ' ').replace(/\s+/g, ' ').trim();

  rec.onresult = (e) => {
    const alternatives = e.results?.[0] ? Array.from(e.results[0]) : [];
    const spoken = alternatives.map(x => x.transcript || '').find(Boolean) || '';
    const a = normalize(expectedText);
    const b = normalize(spoken);
    const matched = a && b && (
      a === b || b.includes(a) || a.includes(b) ||
      (Math.min(a.length, b.length) / Math.max(a.length, b.length) >= 0.78)
    );

    if (matched) {
      resEl.textContent = `✅ బాగా చెప్పారు: "${spoken}"`;
      const rewardId = resId.startsWith('m_') ? `speech_${resId}` : `speech_${targetLang}_${a}`;
      rewardOnce(rewardId, 10, '🎤 Speaking practice! +10 XP');
    } else {
      resEl.textContent = spoken
        ? `🔁 మీరు పలికింది: "${spoken}" — లక్ష్య వాక్యాన్ని మరోసారి నెమ్మదిగా పలకండి.`
        : '🔁 మాట వినిపించలేదు. మళ్లీ ప్రయత్నించండి.';
    }
  };

  rec.onerror = (e) => {
    const messages = {
      'not-allowed': 'మైక్ అనుమతి ఇవ్వండి. Chrome Site settingsలో Microphone → Allow చేయండి.',
      'service-not-allowed': 'Speech సేవ అందుబాటులో లేదు. ఇంటర్నెట్ కనెక్షన్‌తో HTTPS వెబ్‌సైట్‌లో ప్రయత్నించండి.',
      'no-speech': 'మీ మాట వినిపించలేదు. మైక్ దగ్గరగా ఉంచి మళ్లీ ప్రయత్నించండి.',
      'audio-capture': 'మైక్రోఫోన్ పనిచేయడం లేదు. ఫోన్ మైక్/అనుమతులు పరిశీలించండి.',
      'network': 'Speech సేవకు కనెక్షన్ కాలేదు. ఇంటర్నెట్ ఆన్ చేసి మళ్లీ ప్రయత్నించండి.',
      'language-not-supported': 'ఈ భాషకు Speech Recognition మద్దతు లేదు. Chromeలో మళ్లీ ప్రయత్నించండి.'
    };
    resEl.textContent = '⚠️ ' + (messages[e.error] || `Speech సమస్య (${e.error || 'unknown'}). మళ్లీ ప్రయత్నించండి.`);
    finished = true;
    resetButton();
  };

  rec.onend = () => {
    if (!finished && resEl.textContent.includes('ఇప్పుడు మైక్')) {
      resEl.textContent = '🔁 వినడం ముగిసింది. మాట రికార్డ్ కాలేదు; మళ్లీ Speak & Check నొక్కండి.';
    }
    resetButton();
  };

  try {
    rec.start();
  } catch (e) {
    finished = true;
    resetButton();
    resEl.textContent = '⚠️ మైక్ ప్రారంభం కాలేదు. మరోసారి నొక్కండి; మైక్ అనుమతి కూడా పరిశీలించండి.';
  }
}

// TRACING PAD LOGIC
const canvas = document.getElementById('traceCanvas');
const ctx = canvas.getContext('2d');

function resizeCanvas() {
  const rect = canvas.parentElement.getBoundingClientRect();
  if (rect.width === 0 || rect.height === 0) return;
  const old = document.createElement('canvas');
  old.width = canvas.width; old.height = canvas.height;
  if (old.width && old.height) old.getContext('2d').drawImage(canvas,0,0);
  const dpr = Math.max(1, Math.min(3, window.devicePixelRatio || 1));
  canvas.width = Math.round(rect.width * dpr);
  canvas.height = Math.round(rect.height * dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
  if (old.width && old.height) ctx.drawImage(old,0,0,old.width,old.height,0,0,rect.width,rect.height);
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.lineWidth = 7; ctx.strokeStyle = penColor;
}

function getPos(e) {
  const rect = canvas.getBoundingClientRect();
  return { x: e.clientX - rect.left, y: e.clientY - rect.top };
}

function startDraw(e) {
  if (e.button !== undefined && e.button !== 0) return;
  e.preventDefault();
  isDrawing = true;
  if (canvas.setPointerCapture && e.pointerId !== undefined) {
    try { canvas.setPointerCapture(e.pointerId); } catch (_) {}
  }
  const p = getPos(e);
  window.lastTracePoint = p;
  ctx.beginPath();
  ctx.moveTo(p.x, p.y);
}

function moveDraw(e) {
  if (!isDrawing) return;
  e.preventDefault();
  const p = getPos(e);
  ctx.strokeStyle = penColor;
  ctx.lineWidth = 7;
  const prev = window.lastTracePoint || p;
  traceDistance += Math.hypot(p.x-prev.x, p.y-prev.y);
  window.lastTracePoint = p;
  if (traceDistance > 12) hasDrawn = true;
  ctx.lineTo(p.x, p.y);
  ctx.stroke();
}

function endDraw() { isDrawing = false; window.lastTracePoint = null; }

canvas.addEventListener('pointerdown', startDraw);
canvas.addEventListener('pointermove', moveDraw);
canvas.addEventListener('pointerup', endDraw);
canvas.addEventListener('pointercancel', endDraw);
canvas.addEventListener('lostpointercapture', endDraw);

function clearPad() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  hasDrawn = false;
  traceDistance = 0;
}

function setPenColor(c, el) {
  penColor = c;
  document.querySelectorAll('.color-dot').forEach(d => d.classList.remove('active'));
  el.classList.add('active');
}

function finishTrace() {
  if (!hasDrawn || traceDistance < 12) { showToast('✍️ Mundu aksharam practice cheyandi!'); return; }
  rewardOnce(`trace_${targetLang}_${traceLetterKey || 'practice'}`, 5, '✍️ Writing practice! +5 XP');
  clearPad();
}

    cont.innerHTML = `
      <table class="cmp-table">
        <tr><th>Sound</th><th>తెలుగు</th><th>தமிழ்</th><th>ಕನ್ನಡ</th><th>മലയാളം</th></tr>
        ${all.map(a => `
          <tr>
            <td class="snd">${a.s}</td>
            <td onclick="speak('${a.te}',0.8,'te')">${a.te}</td>
            <td onclick="speak('${a.ta}',0.8,'ta')">${a.ta}</td>
            <td onclick="speak('${a.kn}',0.8,'kn')">${a.kn}</td>
            <td onclick="speak('${a.ml}',0.8,'ml')">${a.ml}</td>
          </tr>`).join('')}
      </table>`;
    return;
  }

  const list = ALPHABETS[alphaMode];
  document.getElementById('ghostLetter').textContent = list[0][targetLang].replace('*','');
  cont.innerHTML = `<div class="script-grid">` + list.map((a, i) => `
    <div class="alpha-card" role="button" tabindex="0" onclick="selectLetter('${alphaMode}', ${i}, this)" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();selectLetter('${alphaMode}', ${i}, this)}">
      <div class="a-target">${a[targetLang]}</div>
      <div class="a-known">${a[knownLang]}</div>
      <div class="a-sound">${a.s} 🔊</div>
    </div>`).join('') + `</div>`;
}


function shuffled(items) {
  const copy = [...items];
  for (let i = copy.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [copy[i], copy[j]] = [copy[j], copy[i]];
  }
  return copy;
}

function setQuizMode(m) {
  quizMode = m;
  document.getElementById('btnQSent').classList.toggle('active', m === 'sentence');
  document.getElementById('btnQAlpha').classList.toggle('active', m === 'alpha');
  nextQuiz();
}

function nextQuiz() {
  quizLocked = false;
  const qTarget = document.getElementById('quizTarget');
  const qPron = document.getElementById('quizPron');
  const qOpts = document.getElementById('quizOpts');
  const qTrick = document.getElementById('quizTrick');
  document.getElementById('quizMsg').textContent = '';
  qTrick.style.display = 'none';

  if (quizMode === 'alpha') {
    document.getElementById('quizBadge').textContent = '🔤 ALPHABET QUIZ (+10 XP)';
    qTarget.classList.add('alpha-big');
    qOpts.classList.add('alpha-grid');

    const pool = [...ALPHABETS.vowels, ...ALPHABETS.cons].filter(
      a => a[targetLang] !== '—' && !a[targetLang].includes('*') && a[knownLang] !== '—'
    );
    quizItem = pool[Math.floor(Math.random() * pool.length)];
    qTarget.textContent = quizItem[targetLang];
    qPron.textContent = 'Ee aksharam edhi? (Audio vini leda chusi cheppandi)';

    const choices = shuffled(pool).slice(0, Math.min(4, pool.length));
    if (!quizItem || choices.length === 0) {
      qTarget.textContent = 'ఈ భాషకు అక్షరాలు అందుబాటులో లేవు';
      qOpts.innerHTML = '';
      return;
    }
    if (!choices.includes(quizItem)) choices[0] = quizItem;
    const finalChoices = shuffled(choices);

    qOpts.innerHTML = finalChoices.map(c =>
      `<button class="opt-btn" onclick="checkAlphaQuiz(this, '${c.s}')">${c[knownLang]} <small style="font-size:0.78rem;color:#64748b">(${c.s})</small></button>`
    ).join('');
    return;
  }

  document.getElementById('quizBadge').textContent = '💬 SENTENCE QUIZ (+15 XP)';
  qTarget.classList.remove('alpha-big');
  qOpts.classList.remove('alpha-grid');

  quizItem = DATA[Math.floor(Math.random() * DATA.length)];
  qTarget.textContent = quizItem[targetLang].t;
  qPron.textContent = quizItem[targetLang].r;

  const choices = shuffled(DATA).slice(0, Math.min(4, DATA.length));
  if (!choices.includes(quizItem)) choices[0] = quizItem;
  const finalChoices = shuffled(choices);
  qOpts.innerHTML = finalChoices.map(c =>
    `<button class="opt-btn" onclick="checkQuiz(this, '${c.id}')">${c[knownLang].t}</button>`
  ).join('');
}

function speakQuiz() {
  if (!quizItem) return;
  if (quizMode === 'alpha') speak(quizItem[targetLang], 0.8);
  else speak(quizItem[targetLang].t, 0.9);
}

function checkQuiz(btn, id) {
  if (quizLocked) return;
  quizLocked = true;
  if (id === quizItem.id) {
    btn.classList.add('correct');
    document.getElementById('quizMsg').textContent = '✅ Super! Correct Answer!';
    rewardOnce(`quiz_sentence_${quizItem.id}`, 15, '🎯 Sentence quiz! +15 XP');
  } else {
    btn.classList.add('wrong');
    document.getElementById('quizMsg').textContent = '❌ Correct: ' + quizItem[knownLang].t;
  }
}

function checkAlphaQuiz(btn, sound) {
  if (quizLocked) return;
  quizLocked = true;
  if (sound === quizItem.s) {
    btn.classList.add('correct');
    document.getElementById('quizMsg').textContent = `✅ Super! "${quizItem[targetLang]}" ante "${quizItem[knownLang]} (${quizItem.s})"`;
    rewardOnce(`quiz_alpha_${quizItem.s}`, 10, '🔤 Alphabet quiz! +10 XP');
  } else {
    btn.classList.add('wrong');
    document.getElementById('quizMsg').textContent = `❌ Correct: ${quizItem[knownLang]} (${quizItem.s})`;
  }
  const qTrick = document.getElementById('quizTrick');
  qTrick.innerHTML = `💡 <strong>Memory Trick:</strong> ${quizItem.trick}`;
  qTrick.style.display = 'block';
}

function refreshAll() {
  saveState();
  renderTopics();
  resetRoleplay();
  renderTutor();
  renderScript();
  nextQuiz();
}

initStreak();
refreshAll();
window.addEventListener('resize', resizeCanvas);
</script>
